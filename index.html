<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentHub — Panel de Administración</title>

  <!-- Tailwind config: debe cargarse ANTES del CDN -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<!--
  Layout de dos columnas:
  ┌──────────┬──────────────────────────────────────┐
  │          │  <header> — barra superior fija       │
  │  <aside> ├──────────────────────────────────────┤
  │  sidebar │                                      │
  │   fija   │  <main> — contenido scrollable       │
  │          │                                      │
  └──────────┴──────────────────────────────────────┘
-->
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased">

  <div class="flex h-screen overflow-hidden">

    <!-- ═══════════════════════════════════════════
         ASIDE — Sidebar fija izquierda
    ════════════════════════════════════════════ -->
    <aside
      id="sidebar"
      class="w-64 shrink-0 flex flex-col bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 h-screen overflow-y-auto"
    >
      <!-- ── Logo ──────────────────────────────────── -->
      <div class="flex items-center gap-3 px-6 h-16 border-b border-gray-200 dark:border-gray-800 shrink-0">
        <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center shrink-0">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <span class="text-lg font-bold text-gray-900 dark:text-white tracking-tight">AgentHub</span>
      </div>

      <!-- ── Navegación ─────────────────────────────── -->
      <nav class="flex-1 px-3 py-4 space-y-1" aria-label="Navegación principal">

        <!-- Dashboard -->
        <a href="#" data-section="dashboard"
          class="nav-item active-section group flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150"
          aria-current="page"
        >
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          <span>Dashboard</span>
        </a>

        <!-- Gestión de Usuarios -->
        <a href="#" data-section="usuarios"
          class="nav-item group flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150"
        >
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <span>Usuarios</span>
        </a>

        <!-- Gestión de Agentes -->
        <a href="#" data-section="agentes"
          class="nav-item group flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150"
        >
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/>
          </svg>
          <span>Agentes</span>
        </a>

        <!-- Skills -->
        <a href="#" data-section="skills"
          class="nav-item group flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150"
        >
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"/>
          </svg>
          <span>Skills</span>
        </a>

        <!-- Contrataciones -->
        <a href="#" data-section="contrataciones"
          class="nav-item group flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150"
        >
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <span>Contrataciones</span>
        </a>

        <!-- Log de Errores -->
        <a href="#" data-section="errores"
          class="nav-item group flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150"
        >
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <span>Log de Errores</span>
        </a>

      </nav>

      <!-- ── Footer de sidebar ───────────────────────── -->
      <div class="px-6 py-4 border-t border-gray-200 dark:border-gray-800 shrink-0">
        <p class="text-xs text-gray-400 dark:text-gray-500">AgentHub Admin v1.0</p>
      </div>

    </aside>

    <!-- ═══════════════════════════════════════════
         COLUMNA DERECHA — header + main
    ════════════════════════════════════════════ -->
    <div class="flex flex-col flex-1 min-w-0 overflow-hidden">

      <!-- Barra superior fija -->
      <header
        id="top-header"
        class="shrink-0 flex items-center justify-between h-16 px-6 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800"
      >
        <!-- Título dinámico de la sección activa -->
        <h1 id="section-title" class="text-lg font-semibold text-gray-800 dark:text-gray-100">
          Dashboard
        </h1>
        <!-- Toggle dark / light mode -->
        <button
          id="dark-toggle"
          type="button"
          aria-label="Cambiar modo oscuro/claro"
          class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800 transition-all duration-150"
        >
          <!-- Icono Luna (visible en modo claro) -->
          <svg id="icon-moon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
          <!-- Icono Sol (visible en modo oscuro) -->
          <svg id="icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <span id="toggle-label" class="hidden sm:inline">Modo oscuro</span>
        </button>
      </header>

      <!-- Área de contenido principal scrollable -->
      <main
        id="main-content"
        class="flex-1 overflow-y-auto p-6 bg-gray-50 dark:bg-gray-950"
      >

        <!-- ── Sección: Dashboard ─────────────────── -->
        <section id="sec-dashboard" class="space-y-6">
          <div class="rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-8 text-center text-gray-400 dark:text-gray-500">
            Dashboard — Etapa 3
          </div>
        </section>

        <!-- ── Sección: Usuarios ──────────────────── -->
        <section id="sec-usuarios" class="hidden space-y-6">
          <div class="rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-8 text-center text-gray-400 dark:text-gray-500">
            Gestión de Usuarios — Etapa 4
          </div>
        </section>

        <!-- ── Sección: Agentes ───────────────────── -->
        <section id="sec-agentes" class="hidden space-y-6">
          <div class="rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-8 text-center text-gray-400 dark:text-gray-500">
            Gestión de Agentes — Etapa 5
          </div>
        </section>

        <!-- ── Sección: Skills ────────────────────── -->
        <section id="sec-skills" class="hidden space-y-6">
          <div class="rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-8 text-center text-gray-400 dark:text-gray-500">
            Skills — Etapa 6
          </div>
        </section>

        <!-- ── Sección: Contrataciones ────────────── -->
        <section id="sec-contrataciones" class="hidden space-y-6">
          <div class="rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-8 text-center text-gray-400 dark:text-gray-500">
            Contrataciones — Etapa 7
          </div>
        </section>

        <!-- ── Sección: Log de errores ────────────── -->
        <section id="sec-errores" class="hidden space-y-6">
          <div class="rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-8 text-center text-gray-400 dark:text-gray-500">
            Log de Errores — Etapa 8
          </div>
        </section>

      </main>
    </div><!-- /columna derecha -->

  </div><!-- /flex wrapper -->

  <script>
    // ─────────────────────────────────────────────
    // CONFIGURACIÓN: mapa de secciones
    // ─────────────────────────────────────────────
    const SECTIONS = {
      dashboard:      { id: 'sec-dashboard',      title: 'Dashboard' },
      usuarios:       { id: 'sec-usuarios',       title: 'Gestión de Usuarios' },
      agentes:        { id: 'sec-agentes',        title: 'Gestión de Agentes' },
      skills:         { id: 'sec-skills',         title: 'Skills' },
      contrataciones: { id: 'sec-contrataciones', title: 'Contrataciones' },
      errores:        { id: 'sec-errores',        title: 'Log de Errores' },
    };

    // ─────────────────────────────────────────────
    // NAVEGACIÓN ENTRE SECCIONES
    // ─────────────────────────────────────────────
    let currentSection = 'dashboard';

    function navigateTo(sectionKey) {
      if (!SECTIONS[sectionKey]) return;

      // Ocultar sección actual, mostrar la nueva
      document.getElementById(SECTIONS[currentSection].id).classList.add('hidden');
      document.getElementById(SECTIONS[sectionKey].id).classList.remove('hidden');

      // Actualizar título del header
      document.getElementById('section-title').textContent = SECTIONS[sectionKey].title;

      // Actualizar estado activo en la sidebar
      document.querySelectorAll('.nav-item').forEach(link => {
        const isActive = link.dataset.section === sectionKey;
        link.classList.toggle('active-section', isActive);
        link.setAttribute('aria-current', isActive ? 'page' : 'false');
      });

      currentSection = sectionKey;
    }

    // Listeners de navegación
    document.querySelectorAll('.nav-item').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        navigateTo(link.dataset.section);
      });
    });

    // Estilos de nav-item: activo vs inactivo (via CSS clases dinámicas)
    // Aplicados con JS para evitar duplicar clases en el HTML
    const styleSheet = document.createElement('style');
    styleSheet.textContent = `
      .nav-item {
        color: #6b7280; /* gray-500 */
      }
      .nav-item:hover {
        background-color: #f9fafb; /* gray-50 */
        color: #111827; /* gray-900 */
      }
      .nav-item.active-section {
        background-color: #eef2ff; /* brand-50/indigo-50 */
        color: #4f46e5; /* brand-600 */
        font-weight: 600;
      }
      .dark .nav-item {
        color: #9ca3af; /* gray-400 */
      }
      .dark .nav-item:hover {
        background-color: #1f2937; /* gray-800 */
        color: #f9fafb; /* gray-50 */
      }
      .dark .nav-item.active-section {
        background-color: #312e81; /* brand-900 */
        color: #a5b4fc; /* brand-300 */
      }
    `;
    document.head.appendChild(styleSheet);

    // ─────────────────────────────────────────────
    // DARK MODE TOGGLE
    // ─────────────────────────────────────────────
    const htmlEl      = document.documentElement;
    const toggleBtn   = document.getElementById('dark-toggle');
    const iconMoon    = document.getElementById('icon-moon');
    const iconSun     = document.getElementById('icon-sun');
    const toggleLabel = document.getElementById('toggle-label');

    function applyDarkMode(isDark) {
      htmlEl.classList.toggle('dark', isDark);
      iconMoon.classList.toggle('hidden', isDark);
      iconSun.classList.toggle('hidden', !isDark);
      toggleLabel.textContent = isDark ? 'Modo claro' : 'Modo oscuro';
    }

    // Leer preferencia guardada al cargar
    const savedMode = localStorage.getItem('agenthub-dark-mode');
    const prefersDark = savedMode !== null
      ? savedMode === 'true'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyDarkMode(prefersDark);

    // Listener del botón toggle
    toggleBtn.addEventListener('click', () => {
      const isDark = !htmlEl.classList.contains('dark');
      applyDarkMode(isDark);
      localStorage.setItem('agenthub-dark-mode', isDark);
    });

    console.log('AgentHub Admin — Etapa 2: sidebar + navegación + dark mode ✅');
  </script>

</body>
</html>
