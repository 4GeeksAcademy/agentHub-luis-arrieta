<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentHub — Panel de Administración</title>

  <!-- Tailwind config: debe cargarse ANTES del CDN -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<!--
  Layout de dos columnas:
  ┌──────────┬──────────────────────────────────────┐
  │          │  <header> — barra superior fija       │
  │  <aside> ├──────────────────────────────────────┤
  │  sidebar │                                      │
  │   fija   │  <main> — contenido scrollable       │
  │          │                                      │
  └──────────┴──────────────────────────────────────┘
-->
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased">

  <div class="flex h-screen overflow-hidden">

    <!-- ═══════════════════════════════════════════
         ASIDE — Sidebar fija izquierda
    ════════════════════════════════════════════ -->
    <aside
      id="sidebar"
      class="w-64 shrink-0 flex flex-col bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 h-screen overflow-y-auto"
    >
      <!-- Placeholder: contenido en Etapa 2 -->
      <div class="p-6 border-b border-gray-200 dark:border-gray-800">
        <span class="text-lg font-bold text-brand-600 dark:text-brand-400">AgentHub</span>
      </div>
      <nav class="flex-1 p-4">
        <p class="text-xs text-gray-400 px-3 py-2">Navegación — Etapa 2</p>
      </nav>
    </aside>

    <!-- ═══════════════════════════════════════════
         COLUMNA DERECHA — header + main
    ════════════════════════════════════════════ -->
    <div class="flex flex-col flex-1 min-w-0 overflow-hidden">

      <!-- Barra superior fija -->
      <header
        id="top-header"
        class="shrink-0 flex items-center justify-between h-16 px-6 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800"
      >
        <!-- Título dinámico de la sección activa -->
        <h1 id="section-title" class="text-lg font-semibold text-gray-800 dark:text-gray-100">
          Dashboard
        </h1>
        <!-- Placeholder toggle dark mode — Etapa 2 -->
        <button class="p-2 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
          <span class="text-sm">🌙 / ☀️ — Etapa 2</span>
        </button>
      </header>

      <!-- Área de contenido principal scrollable -->
      <main
        id="main-content"
        class="flex-1 overflow-y-auto p-6 bg-gray-50 dark:bg-gray-950"
      >

        <!-- ── Sección: Dashboard ─────────────────── -->
        <section id="sec-dashboard" class="space-y-6">
          <div class="rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-8 text-center text-gray-400 dark:text-gray-500">
            Dashboard — Etapa 3
          </div>
        </section>

        <!-- ── Sección: Usuarios ──────────────────── -->
        <section id="sec-usuarios" class="hidden space-y-6">
          <div class="rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-8 text-center text-gray-400 dark:text-gray-500">
            Gestión de Usuarios — Etapa 4
          </div>
        </section>

        <!-- ── Sección: Agentes ───────────────────── -->
        <section id="sec-agentes" class="hidden space-y-6">
          <div class="rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-8 text-center text-gray-400 dark:text-gray-500">
            Gestión de Agentes — Etapa 5
          </div>
        </section>

        <!-- ── Sección: Skills ────────────────────── -->
        <section id="sec-skills" class="hidden space-y-6">
          <div class="rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-8 text-center text-gray-400 dark:text-gray-500">
            Skills — Etapa 6
          </div>
        </section>

        <!-- ── Sección: Contrataciones ────────────── -->
        <section id="sec-contrataciones" class="hidden space-y-6">
          <div class="rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-8 text-center text-gray-400 dark:text-gray-500">
            Contrataciones — Etapa 7
          </div>
        </section>

        <!-- ── Sección: Log de errores ────────────── -->
        <section id="sec-errores" class="hidden space-y-6">
          <div class="rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-8 text-center text-gray-400 dark:text-gray-500">
            Log de Errores — Etapa 8
          </div>
        </section>

      </main>
    </div><!-- /columna derecha -->

  </div><!-- /flex wrapper -->

  <!-- JavaScript — Etapa 2+ -->
  <script>
    // Navegación básica: placeholder hasta Etapa 2
    console.log('AgentHub Admin — Etapa 1: esqueleto listo ✅');
  </script>

</body>
</html>
